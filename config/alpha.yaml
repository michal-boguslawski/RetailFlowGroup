store_id: alpha
ids:
  user_id:
    style: uuid
  order_id:
    style: integer
    prefix: alpha_
  product_id:
    style: uuid
    prefix: prod_

state_path: data/state/alpha_generator_state.json
clock_drift_seconds: 100

breaktime_config:
  shape: 0.5
  scale: 0.5

pipeline_config:
  null_rates:
    rates:
      user: 0.12
      session_id: 0.08
      phone: 0.4
      date_of_birth: 0.3
  field_case_corrupt_rates:
    rates:
      email: 0.05
  duplication_rate: 0.02
  legacy_rate: 0.15

async_generators:
  - name: users
    breaktime_config:
      shape: 12
      scale: 5
