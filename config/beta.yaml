store_id: beta
ids:
  user_id:
    style: integer
  order_id:
    style: integer
  product_id:
    style: uuid
    prefix: prod_
  product_id_legacy:
    style: integer
  order_event_id:
    style: integer
    prefix: EVT-

state_path: data/state/beta_generator_state.json
clock_drift_seconds: 100

pipeline_config:
  null_rates:
    rates:
      user: 0.18
      email_hash: 0.05
      phone_hash: 0.4
      loyalty_points: 0.05
  field_case_corrupt_rates:
    rates:
      email: 0.
  duplication_rate: 0.02
  legacy_rate: 0.08

async_generators:
  - name: users
    breaktime_config:
      shape: 12
      scale: 5
