name: retailflow

services:
  kafka-1:
    image: bitnami/kafka:3.9
    hostname: kafka-1
    ports:
      - "29092:29092"
    volumes:
      - "kafka_data_1:/bitnami"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_KRAFT_CLUSTER_ID=xYN3lhaZR8qtJRUalXzIgQ
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:19092,2@kafka-2:19092
      - KAFKA_BROKER_ID=1

      - KAFKA_CFG_LISTENERS=INTERNAL://:9092,CONTROLLER://:19092,EXTERNAL://:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka-1:9092,EXTERNAL://localhost:29092
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_NUM_PARTITIONS=2
      - KAFKA_CFG_NODE_ID=1
      - ALLOW_PLAINTEXT_LISTENER=yes
      - BITNAMI_DEBUG=yes
    networks:
      - retailflow 

  kafka-2:
    image: bitnami/kafka:3.9
    hostname: kafka-2
    ports:
      - "29093:29093"
    volumes:
      - "kafka_data_2:/bitnami"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_KRAFT_CLUSTER_ID=xYN3lhaZR8qtJRUalXzIgQ
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:19092,2@kafka-2:19092
      - KAFKA_BROKER_ID=2

      - KAFKA_CFG_LISTENERS=INTERNAL://:9092,CONTROLLER://:19092,EXTERNAL://:29093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka-2:9092,EXTERNAL://localhost:29093
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_NUM_PARTITIONS=2
      - KAFKA_CFG_NODE_ID=2
      - ALLOW_PLAINTEXT_LISTENER=yes
      - BITNAMI_DEBUG=yes
    networks:
      - retailflow 

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - 8081:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: docker-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092

      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    networks:
      - retailflow

  schema-registry:
    image: confluentinc/cp-schema-registry:8.1.3
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      - kafka-1
      - kafka-2
    ports:
      - "8082:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:9092,PLAINTEXT://kafka-2:9092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retailflow

  alpha-db:
    image: postgres:17.5-alpine3.22
    container_name: alpha-postgres-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=alpha
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=alpha_db
    volumes:
      - alpha_pg_data:/var/lib/postgresql/data
      - ./infra/postgres/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - retailflow

  mongo-db:
    image: mongo:8.2.11
    container_name: mongo-db
    ports:
      - 27017:27017
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    networks:
      - retailflow

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    restart: always
    ports:
      - 8083:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo-db:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: mongoexpressuser
      ME_CONFIG_BASICAUTH_PASSWORD: mongoexpresspass
    networks:
      - retailflow

  storage:
    image: quay.io/minio/aistor/minio:RELEASE.2026-03-26T21-24-40Z
    command: minio server /mnt/data --license /minio.license
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/mnt/data
      - ./minio/minio.license:/minio.license
      - ./minio/certs:/etc/minio/certs
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_NOTIFY_KAFKA_ENABLE_LANDING_EVENTS: on
      MINIO_NOTIFY_KAFKA_BROKERS_LANDING_EVENTS: kafka-1:9092,kafka-2:9092
      MINIO_NOTIFY_KAFKA_TOPIC_LANDING_EVENTS: ${MINIO_NOTIFY_KAFKA_TOPIC_LANDING_EVENTS}
    networks:
      - retailflow
    depends_on:
      - kafka-1
      - kafka-2

# spark
  spark-master:
    image: spark:3.5.6-scala2.12-java17-python3-ubuntu
    ports:
      - "8084:8080"   # Web UI
      - "7077:7077"   # Spark master
    volumes:
      - ./:/opt/retailflow
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    networks:
      - retailflow

  spark-worker-1:
    image: spark:3.5.6-scala2.12-java17-python3-ubuntu
    volumes:
      - ./:/opt/retailflow
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - retailflow

  spark-worker-2:
    image: spark:3.5.6-scala2.12-java17-python3-ubuntu
    volumes:
      - ./:/opt/retailflow
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - retailflow

  spark-submit:
    image: spark:3.5.6-scala2.12-java17-python3-ubuntu
    volumes:
      - ./:/opt/retailflow
    environment:
      HOME: /tmp
      UV_CACHE_DIR: /tmp/uv-cache
      UV_DATA_DIR: /tmp/uv-data
      UV_PYTHON_INSTALL_DIR: /tmp/uv-python
    working_dir: /opt/retailflow
    command: tail -f /dev/null
    networks:
      - retailflow

volumes:
  kafka_data_1:
    driver: local
  kafka_data_2:
    driver: local
  alpha_pg_data:
    driver: local
  minio_data:
    driver: local

networks:
  retailflow:
    external: true
    name: retailflow